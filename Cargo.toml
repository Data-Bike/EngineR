# EngineR — Cargo workspace.
#
# Normative source: docs/05-rust-workspace.md.
# Deviation ADR-007-adj: docs pin sqlx 0.5.13; on the current Rust toolchain
# (1.95+) sqlx 0.5's transitive deps no longer compile cleanly, so the workspace
# uses sqlx 0.7.4 which still provides the required
# `runtime-async-std-native-tls` feature and the same async-std PgPool ownership
# model. The DbExecutor port (crates/db-runtime-async-std) keeps the runtime
# isolated, so a future bump/downdown is a single ADR without touching domain.
[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "apps/mcp",
    "apps/dump",
    "crates/domain",
    "crates/contracts",
    "crates/application",
    "crates/observability",
    "crates/db-runtime-async-std",
    "crates/persistence-postgres",
    "crates/security-domain",
    "crates/security-pdp",
    "crates/security-api",
    "crates/schema-registry",
    "crates/identity",
    "crates/query-engine",
    "crates/connectors",
    "crates/risk-engine",
    "crates/workflow",
    "crates/files",
    "crates/reporting",
    "crates/security",
    "crates/audit-persistence",
    "crates/integration",
    "crates/test-support",
]
exclude = ["legacy-prototype"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
authors = ["EngineR team"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Internal crates.
enginer-domain = { path = "crates/domain" }
enginer-contracts = { path = "crates/contracts" }
enginer-application = { path = "crates/application" }
enginer-observability = { path = "crates/observability" }
enginer-db-runtime = { path = "crates/db-runtime-async-std" }
enginer-persistence = { path = "crates/persistence-postgres" }
enginer-security-domain = { path = "crates/security-domain" }
enginer-security-pdp = { path = "crates/security-pdp" }
enginer-security-api = { path = "crates/security-api" }
enginer-schema-registry = { path = "crates/schema-registry" }
enginer-identity = { path = "crates/identity" }
enginer-query-engine = { path = "crates/query-engine" }
enginer-connectors = { path = "crates/connectors" }
enginer-risk-engine = { path = "crates/risk-engine" }
enginer-workflow = { path = "crates/workflow" }
enginer-files = { path = "crates/files" }
enginer-reporting = { path = "crates/reporting" }
enginer-security = { path = "crates/security" }
enginer-audit-persistence = { path = "crates/audit-persistence" }
enginer-test-support = { path = "crates/test-support" }

# Async / web.
rocket = { version = "0.5.1", features = ["json", "secrets"] }
tokio = { version = "1", features = ["full"] }
async-std = { version = "1.12", features = ["attributes"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }

# Serialization / data.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }

# DB.
sqlx = { version = "0.7.4", default-features = false, features = [
    "runtime-async-std-native-tls",
    "postgres",
    "chrono",
    "json",
    "uuid",
    "migrate",
    "macros",
] }

# Crypto / encoding.
blake2 = "0.10"
sha2 = "0.10"
base64ct = { version = "1.6", features = ["alloc"] }
argon2 = "0.5"
hex = "0.4"

# Errors / logging.
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config.
toml = "0.8"

# Dev.
proptest = "1"
pretty_assertions = "1"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
# Public API doc coverage is enforced from Phase 2 onward (docs/05 §10).
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stderr = "allow"
print_stdout = "deny"
