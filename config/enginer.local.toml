# EngineR API local configuration (docs/23 §4).
# Override with ENGINER_CONFIG=/path/to/config.toml or env vars.

[http]
public_origin = "http://localhost:8000"
request_timeout_ms = 5000
max_json_bytes = 1048576

[database]
# Local dev: point directly at the docker-compose Postgres.
# Production: use a secret ref like "secret://enginer/db".
url_secret_ref = "postgres://enginer_app:enginer_app@localhost:6543/enginer"
max_connections = 40
acquire_timeout_ms = 500
statement_timeout_ms = 4000
db_executor_queue = 200

[security]
policy_cache_ttl_seconds = 30
fail_closed = true
internal_mtls_identity = "enginer-api"
